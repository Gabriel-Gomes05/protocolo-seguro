<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="Esquadrão Sentinela: treinamentos interativos de segurança da informação, com heróis, vilões e decisões.">
  <title>Esquadrão Sentinela</title>
  <link rel="stylesheet" href="player/player.css">
  <link rel="stylesheet" href="player/qg.css">
</head>
<body class="qg">
  <header class="qg-topo">
    <span class="qg-marca"><span class="logo-cliente" id="logo"></span><span id="empresa"></span></span>
    <span class="qg-status" id="status"></span>
  </header>

  <main>
    <section class="qg-hero">
      <div class="qg-hero-texto">
        <p class="decisao-rotulo">TREINAMENTO INTERATIVO DE SEGURANÇA DA INFORMAÇÃO</p>
        <h1>Esquadrão<br><span>Sentinela</span></h1>
        <p class="qg-lead">Você é o recruta. Quatro vilões, quatro heróis e decisões que mudam a história. Cada missão dura de 6 a 8 minutos e termina com um quiz.</p>
        <div class="qg-insignias" id="insignias" aria-label="Insígnias conquistadas"></div>
      </div>
      <div class="qg-hero-arte" aria-hidden="true">
        <img class="qg-isca" src="assets/personagens/isca-tramando.webp" alt="">
        <img class="qg-lupa" src="assets/personagens/lupa-tres-quartos.webp" alt="">
      </div>
    </section>

    <section class="qg-missoes" aria-label="Missões">
      <h2>Missões</h2>
      <div class="qg-grade" id="grade"></div>
    </section>
  </main>

  <footer class="qg-rodape">
    <span>Esquadrão Sentinela · conteúdo white label para <b id="empresa-rodape"></b></span>
    <a href="legado/index.html">Versão anterior (“Um Clique”)</a>
  </footer>

  <script src="config.js"></script>
  <script src="player/elenco.js"></script>
  <script>
    (() => {
      const CFG = window.SENTINELA_CONFIG || {};
      const q = new URLSearchParams(location.search);
      const empresa = q.get('empresa') || CFG.empresa || 'Empresa';
      const cor = q.get('cor') || CFG.cor;
      if (cor) document.documentElement.style.setProperty('--cliente', cor);
      const extra = ['empresa', 'dominio', 'cor', 'logo'].filter(k => q.get(k)).map(k => `${k}=${encodeURIComponent(q.get(k))}`).join('&');
      const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      document.getElementById('empresa').textContent = empresa;
      document.getElementById('empresa-rodape').textContent = empresa;
      document.getElementById('logo').innerHTML = CFG.logo ? `<img src="${esc(CFG.logo)}" alt="">` : esc(empresa[0]);

      const { ELENCO, spriteDe } = window.SentinelaElenco;
      const MISSOES = [
        { id: 'isca', n: 1, titulo: 'A Isca', tema: 'Phishing', foco: 'E-mail, SMS e WhatsApp falsos. Como reconhecer e reportar.', heroi: 'lupa', vilao: 'isca', pose: 'apresentando', arquivo: 'modulo-1-isca.html', insignia: 'lupa' },
        { id: 'forca-bruta', n: 2, titulo: 'A Força Bruta', tema: 'Senhas', foco: 'Frase-senha, não reutilizar, gerenciador de senhas e segundo fator.', heroi: 'trava', vilao: 'forca', pose: 'brava', arquivo: 'modulo-2-forca-bruta.html', insignia: 'cadeado' },
        { id: 'vazamento', n: 3, titulo: 'O Vazamento', tema: 'LGPD', foco: 'Dados pessoais no dia a dia: só o necessário, só pelo canal oficial.', heroi: 'iris', vilao: 'vazamento', arquivo: 'modulo-3-vazamento.html', insignia: 'cofre' },
        { id: 'camaleao', n: 4, titulo: 'O Camaleão', tema: 'Engenharia social', foco: 'Falso suporte, falso diretor e carona na porta. Confirme por outro canal.', heroi: 'eco', vilao: 'camaleao', arquivo: 'modulo-4-camaleao.html', insignia: 'ondas' }
      ];

      let prog = {};
      try { prog = JSON.parse(localStorage.getItem('sentinela.progresso') || '{}'); } catch (e) { prog = {}; }
      const ganhas = MISSOES.filter(m => prog[m.id] && prog[m.id].aprovado).length;

      document.getElementById('status').textContent = ganhas === 4 ? '★ SENTINELA COMPLETO' : `${ganhas}/4 INSÍGNIAS`;
      document.getElementById('insignias').innerHTML = MISSOES.map(m => {
        const ok = prog[m.id] && prog[m.id].aprovado;
        return `<span class="qg-insignia ${ok ? 'ok' : ''}" style="--cor:${ELENCO[m.heroi].cor}" title="Insígnia ${esc(ELENCO[m.heroi].nome)}${ok ? '' : ' (pendente)'}">${ELENCO[m.heroi].nome[0]}</span>`;
      }).join('') + `<small>${ganhas === 4 ? 'Você é um Sentinela completo.' : 'Conquiste as quatro insígnias para virar Sentinela completo.'}</small>`;

      const card = m => {
        const p = prog[m.id] || {};
        const h = ELENCO[m.heroi], v = ELENCO[m.vilao];
        const href = m.arquivo + (extra ? `?${extra}` : '');
        return `<a class="qg-card ${p.aprovado ? 'feito' : ''}" href="${href}" style="--cor:${h.cor}">
          <div class="qg-card-arte"><div class="qg-ator heroi">${spriteDe(m.heroi, 'tres-quartos')}</div><span class="qg-vs">×</span><div class="qg-ator vilao">${spriteDe(m.vilao, m.pose || 'frente')}</div></div>
          <div class="qg-card-texto">
            <small>MISSÃO ${m.n} · ${esc(m.tema.toUpperCase())}</small>
            <h3>${esc(m.titulo)}</h3>
            <p class="qg-duelo">${esc(h.nome)} × ${esc(v.nome)}</p>
            <p>${esc(m.foco)}</p>
            <span class="qg-card-status">${p.aprovado ? `★ Insígnia conquistada · nota ${p.nota}` : p.nota != null ? `Tentativa: nota ${p.nota} · refaça para a insígnia` : '▶ Começar missão'}</span>
          </div></a>`;
      };
      document.getElementById('grade').innerHTML = MISSOES.map(card).join('') + `
        <div class="qg-card bonus ${ganhas === 4 ? 'liberado' : ''}">
          <div class="qg-card-texto"><small>MISSÃO 5 · BÔNUS</small><h3>Esquadrão Reunido</h3><p>Revisão geral com todos os heróis e certificado.</p>
          <span class="qg-card-status">${ganhas === 4 ? 'Em produção' : `Bloqueada · ${4 - ganhas} insígnia(s) para liberar`}</span></div></div>`;
    })();
  </script>
</body>
</html>
